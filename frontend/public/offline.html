<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#10b981" />
  <title>Offline · Log2Def</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: radial-gradient(circle at 50% 30%, #0d2c20 0%, #071712 100%);
      color: #f1f5f9;
      text-align: center;
    }
    .card {
      background: rgba(15, 30, 24, 0.85);
      border: 1px solid rgba(85, 214, 162, 0.25);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(16, 185, 129, 0.1);
      backdrop-filter: blur(12px);
    }
    .logo-badge {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(85, 214, 162, 0.4);
    }
    .logo-badge img {
      width: 54px;
      height: 54px;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(235, 178, 59, 0.15);
      border: 1px solid rgba(235, 178, 59, 0.4);
      color: #fbbf24;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #fbbf24;
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }
    p {
      font-size: 14.5px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      background: #10b981;
      color: #071712;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: #34d399;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
    }
    .btn:active {
      transform: translateY(0);
    }
    .hint {
      margin-top: 18px;
      font-size: 12.5px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <img src="/logo.svg" alt="Log2Def Logo" />
    </div>
    <div class="status-chip">
      <span class="pulse-dot"></span>
      Offline Mode
    </div>
    <h1>No Internet Connection</h1>
    <p>
      You are currently disconnected. Your local logbook entries and cached report drafts remain safe on this device. Reconnect to sync with cloud AI.
    </p>
    <button class="btn" id="retry-btn" onclick="window.location.reload()">
      Retry Connection
    </button>
    <div class="hint" id="auto-recon">
      Listening for network reconnection...
    </div>
  </div>

  <script>
    window.addEventListener('online', () => {
      const banner = document.getElementById('auto-recon');
      if (banner) banner.innerText = 'Connection restored! Reloading...';
      setTimeout(() => {
        window.location.reload();
      }, 600);
    });
  </script>
</body>
</html>
