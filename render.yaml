services:
  - type: web
    name: log2def-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: log2def-db
          property: connectionString
      - key: AI_PROVIDER
        value: "gemini"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"

databases:
  - name: log2def-db
    plan: free
    region: oregon
