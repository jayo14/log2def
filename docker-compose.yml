services:
  db:
    image: postgres:16-alpine
    container_name: log2def_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: log2def
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: log2def_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: dev-insecure-secret-key-change-in-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DB_ENGINE: postgres
      DB_NAME: log2def
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: db
      DB_PORT: 5432
      AI_PROVIDER: openai
      AI_API_KEY: ""
      AI_MODEL: gpt-4o-mini
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: log2def_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_media:
